name: Update contribution graph

on:
  schedule:
    # 매일 한국 시간 오전 3시 10분
    - cron: "10 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-contribution-graph
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 패키지 설치
        run: pip install -r scripts/requirements.txt

      - name: 최신 기여도 가져오기
        run: python scripts/fetch_contributions.py

      - name: 잔디 SVG 생성
        run: python scripts/render_heatmap_svg.py

      - name: 배포 폴더 준비
        run: |
          mkdir -p generated-output
          cp contrib-heatmap.svg generated-output/contrib-heatmap.svg

      - name: generated 브랜치에 저장
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: generated
          publish_dir: ./generated-output
          commit_message: "chore: 잔디 그래프 자동 갱신"
